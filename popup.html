<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title="读书喵">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>读书喵</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <!-- ====== 新手引导 ====== -->
    <div class="onboarding hidden" id="onboarding">
      <div class="onboard-card">
        <div class="onboard-icon">🐱</div>
        <h2 data-i18n="欢迎使用读书喵！🐱">欢迎使用读书喵！🐱</h2>
        <p data-i18n="添加阅读网站进行在线阅读，或直接开始进入离线模式">添加阅读网站进行在线阅读，或直接开始进入离线模式</p>
        <div class="onboard-modes">
          <div class="onboard-mode">
            <div class="onboard-mode-icon">🌐</div>
            <div class="onboard-mode-title" data-i18n="在线阅读">在线阅读</div>
            <div class="onboard-mode-desc" data-i18n="在阅读网站上读书，只有在这些网站上的时间才计入阅读时长">在阅读网站上读书，只有在这些网站上的时间才计入阅读时长</div>
          </div>
          <div class="onboard-mode">
            <div class="onboard-mode-icon">📚</div>
            <div class="onboard-mode-title" data-i18n="离线阅读">离线阅读</div>
            <div class="onboard-mode-desc" data-i18n="读实体书或用其他软件，计时器自动倒计时，所有网站被屏蔽">读实体书或用其他软件，计时器自动倒计时，所有网站被屏蔽</div>
          </div>
        </div>
        <button class="btn-main btn-start" id="onboardDismiss" data-i18n="知道了">知道了</button>
      </div>
    </div>

    <!-- ====== 顶栏 ====== -->
    <header class="topbar">
      <span class="topbar-icon">🐱</span>
      <span class="topbar-title" data-i18n="读书喵">读书喵</span>
      <button class="icon-btn" id="settingsToggle" title="设置" data-i18n-title="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <!-- ====== 主面板: 计时器 ====== -->
    <main class="panel" id="panelTimer">

      <!-- 圆环计时器 -->
      <div class="timer-container">
        <svg class="timer-ring" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="88" />
          <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="88" />
        </svg>
        <div class="timer-inner">
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="timer-label" id="timerLabel" data-i18n="准备开始">准备开始</div>
        </div>
      </div>

      <!-- idle 状态：时间选择器 -->
      <div class="time-picker" id="timePicker">
        <div class="picker-label" data-i18n="选择阅读时长">选择阅读时长</div>
        <div class="preset-grid" id="presetGrid"></div>
        <div class="custom-time">
          <input type="number" id="customMinutes" min="1" max="480" placeholder="自定义" data-i18n-placeholder="自定义">
          <span class="custom-unit" data-i18n="分钟">分钟</span>
        </div>
      </div>

      <!-- 控制按钮 -->
      <div class="controls" id="controls">
        <button class="btn-main btn-start" id="btnStart" data-i18n="开始阅读">开始阅读</button>
        <button class="btn-main btn-pause hidden" id="btnPause" data-i18n="暂停">暂停</button>
        <button class="btn-main btn-resume hidden" id="btnResume" data-i18n="继续">继续</button>
        <button class="btn-secondary hidden" id="btnStop" data-i18n="结束 Session">结束 Session</button>
        <button class="btn-main btn-done hidden" id="btnDone" data-i18n="开始新 Session">开始新 Session</button>
      </div>

      <!-- running/paused: 调整目标 -->
      <div class="adjust-row hidden" id="adjustRow">
        <button class="btn-adjust" id="adjDown5">−5 min</button>
        <button class="btn-adjust" id="adjDown1">−1</button>
        <button class="btn-adjust" id="adjUp1">+1</button>
        <button class="btn-adjust" id="adjUp5">+5 min</button>
      </div>

      <!-- 阅读网站快览 -->
      <div class="sites-strip" id="sitesStrip"></div>

    </main>

    <!-- ====== 设置面板 ====== -->
    <section class="panel hidden" id="panelSettings">
      <div class="panel-header">
        <button class="icon-btn" id="settingsBack">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span data-i18n="设置">设置</span>
      </div>

      <!-- 个人设置：外观 + 语言 -->
      <div class="setting-section">
        <div class="setting-title" data-i18n="个人设置">个人设置</div>

        <div class="setting-subtitle" data-i18n="外观">外观</div>
        <div class="theme-switcher" id="themeSwitcher">
          <button class="theme-btn active" data-theme="auto" data-i18n="跟随系统">跟随系统</button>
          <button class="theme-btn" data-theme="light" data-i18n="浅色">浅色</button>
          <button class="theme-btn" data-theme="dark" data-i18n="深色">深色</button>
        </div>

        <div class="setting-subtitle" data-i18n="语言">语言</div>
        <div class="theme-switcher" id="langSwitcher">
          <button class="theme-btn active" data-lang="auto" data-i18n="自动">自动</button>
          <button class="theme-btn" data-lang="zh" data-i18n="中文">中文</button>
          <button class="theme-btn" data-lang="en" data-i18n="English">English</button>
        </div>
      </div>

      <!-- 阅读网站 -->
      <div class="setting-section">
        <div class="setting-title" data-i18n="阅读网站">阅读网站</div>
        <p class="setting-desc" data-i18n="只有在这些网站上花的时间才算阅读时间">只有在这些网站上花的时间才算阅读时间</p>
        <div class="site-input-row">
          <input type="text" id="newSiteInput" placeholder="输入域名，如 weread.qq.com" data-i18n-placeholder="输入域名，如 weread.qq.com">
          <button class="btn-add" id="addSiteBtn">+</button>
        </div>
        <div class="sites-list" id="sitesListEdit"></div>

        <div class="setting-subtitle" data-i18n="快捷添加">快捷添加</div>
        <div class="quick-grid" id="quickGrid">
          <button class="chip" data-site="weread.qq.com" data-i18n="📖 微信读书">📖 微信读书</button>
          <button class="chip" data-site="read.douban.com" data-i18n="📗 豆瓣阅读">📗 豆瓣阅读</button>
          <button class="chip" data-site="book.douban.com" data-i18n="📘 豆瓣读书">📘 豆瓣读书</button>
          <button class="chip" data-site="reading.zhihu.com" data-i18n="📕 知乎阅读">📕 知乎阅读</button>
          <button class="chip" data-site="kindle.amazon.com">📙 Kindle</button>
        </div>
        <button class="btn-save" id="saveBtn" data-i18n="保存设置" style="margin-top:14px">保存设置</button>
      </div>

      <!-- 本周统计 -->
      <div class="setting-section">
        <div class="setting-title" data-i18n="本周统计">本周统计</div>
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card">
            <div class="stat-value" id="statTotal">0 min</div>
            <div class="stat-label" data-i18n="总阅读">总阅读</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statSessions">0 <small data-i18n="次">次</small></div>
            <div class="stat-label" data-i18n="完成">完成</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statAvg">0 min</div>
            <div class="stat-label" data-i18n="平均">平均</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statStreak">0 <small data-i18n="天">天</small></div>
            <div class="stat-label" data-i18n="连续">连续</div>
          </div>
        </div>
      </div>

      <!-- 历史 -->
      <div class="setting-section">
        <div class="setting-title" data-i18n="阅读记录">阅读记录</div>
        <div class="history-list" id="historyList"></div>
        <button class="btn-text-danger" id="clearHistoryBtn" data-i18n="清除记录">清除记录</button>
      </div>

    </section>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="i18n.js"></script>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
